<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillwater · A koi garden</title><style>*{box-sizing:border-box}body{margin:0;background:#183f39;color:#fff6db;font-family:Georgia,serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:crosshair}header,footer{position:absolute;left:6vw;pointer-events:none;text-shadow:0 2px 10px #123c35}header{top:6vh}h1{font-weight:400;font-size:clamp(52px,7vw,108px);letter-spacing:-.065em;margin:0}small{font:11px system-ui;letter-spacing:.21em;text-transform:uppercase}footer{bottom:5vh;font:14px system-ui}button{position:absolute;bottom:4vh;right:5vw;color:inherit;background:#193b34cf;border:1px solid #eef4cd66;border-radius:25px;padding:10px 16px}</style><canvas tabindex="0" aria-label="Koi pond. Press Enter to ripple the water."></canvas><header><small>A living koi garden</small><h1>Stillwater</h1></header><footer>Touch the water</footer><button>Pause</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),btn=document.querySelector('button'),tau=Math.PI*2;
let W,H,t=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,bg,seed=332,pointer=null,waves=[];
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const fish=Array.from({length:14},(_,i)=>({x:rnd(),y:.23+rnd()*.68,a:rnd()*tau,k:i,size:.65+rnd()*.65,turn:0,flash:0,spots:Array.from({length:24},()=>[rnd(),rnd(),rnd()])}));
function resize(){W=innerWidth;H=c.clientHeight;let d=Math.min(devicePixelRatio,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);bg=document.createElement('canvas');bg.width=W;bg.height=H;let b=bg.getContext('2d');seed=885;let grad=b.createLinearGradient(0,H,W,0);grad.addColorStop(0,'#102e30');grad.addColorStop(.52,'#306054');grad.addColorStop(1,'#9eab7c');b.fillStyle=grad;b.fillRect(0,0,W,H);
for(let i=0;i<450;i++){let x=rnd()*W,y=rnd()*H,r=3+rnd()*26;b.fillStyle='rgba(9,39,34,.09)';b.beginPath();b.ellipse(x,y,r,r*.53,rnd(),0,tau);b.fill();b.strokeStyle='rgba(209,222,165,.08)';b.stroke()}
for(let i=0;i<16000;i++){b.fillStyle=rnd()<.5?'#ffffff0a':'#0000000c';b.fillRect(rnd()*W,rnd()*H,1.4,1.4)}}
function koi(f){let sz=Math.min(1.4,Math.max(.6,W/960))*f.size,wob=Math.sin(t*3+f.k),tail=7*wob;
g.save();g.translate(f.x*W,f.y*H);g.rotate(f.a);g.scale(sz,sz);
function shape(path,color){g.fillStyle=color;g.fill(new Path2D(path))}
let body=new Path2D('M34 0 C34 -10 15 -14 -2 -11 C-19 -9 -30 -3 -40 '+tail+' Q-27 '+(tail+2)+' -14 7 C5 17 32 11 34 0Z');
g.save();g.translate(5,10);g.fillStyle='#0a252f50';g.fill(body);g.restore();
shape('M-29 0 Q-46 '+(tail-3)+' -55 '+(tail-11)+' Q-54 '+tail+' -46 '+(tail+1)+' Q-54 '+(tail+6)+' -54 '+(tail+11)+' Q-40 '+(tail+6)+' -29 2','#eadcaaab');
for(let s of [-1,1]){g.save();g.scale(1,s);shape('M10 7 Q9 18 -7 23 Q-14 19 -3 9Z','#f5e5b9aa');g.restore()}
g.save();g.clip(body);let grd=g.createLinearGradient(0,-14,0,14);grd.addColorStop(0,'#9e997e');grd.addColorStop(.38,f.k%5===0?'#f8bc52':'#fff2cb');grd.addColorStop(1,'#bfba9a');g.fillStyle=grd;g.fillRect(-48,-16,85,33);
for(let [x,y,r] of f.spots){g.fillStyle=f.k%3===1&&r>.7?'#293735':f.k%5===0?'#d79538':r>.5?'#df552c':'#cc4024';g.beginPath();g.ellipse(x*72-39,y*31-15,3+r*7,3+r*5,x*4,0,tau);g.fill()}
g.strokeStyle='#fff6cb66';g.beginPath();g.moveTo(-19,1);g.quadraticCurveTo(-2,-3,11,-1);g.stroke();g.restore();for(let s of [-1,1]){g.fillStyle='#262b21';g.beginPath();g.arc(25,s*7,1.7,0,tau);g.fill()}g.restore()}
function pads(){for(let i=0;i<28;i++){let side=i%2,x=side?W*(.84+.2*Math.sin(i*52)):W*(.03+.13*Math.cos(i*42)),y=side?H*(.14+.16*Math.cos(i*16)):H*(.88+.13*Math.sin(i*13)),r=Math.min(W,H)*(.023+.027*(1+Math.sin(i*18))/2);g.save();g.translate(x,y+Math.sin(t*.5+i)*1.8);g.rotate(i*.8);g.shadowColor='#142f3199';g.shadowBlur=5;g.shadowOffsetY=5;g.fillStyle=['#728450','#879763','#5d774f','#a4aa6b'][i%4];g.beginPath();g.moveTo(0,0);g.arc(0,0,r,.18,tau-.13);g.closePath();g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.strokeStyle='#cad19555';for(let j=1;j<11;j++){let a=j*.55;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.cos(a+.15)*r*.5,Math.sin(a+.15)*r*.5,Math.cos(a)*r*.94,Math.sin(a)*r*.94);g.stroke()}g.restore()}}
function frame(now){let dt=paused?0:Math.min(.04,(now-last)/1000);last=now;t+=dt;g.drawImage(bg,0,0);
for(let f of fish){let px=f.x*W,py=f.y*H;for(let w of waves){let dx=px-w.x,dy=py-w.y,d=Math.hypot(dx,dy);if(!w.hit.has(f)&&Math.abs(d-(t-w.t)*125)<15){w.hit.add(f);f.turn=Math.sin(Math.atan2(dy,dx)-f.a)>=0?1:-1;f.flash=1}}
let steer=Math.sin(t*.65+f.k)*.35+f.turn*f.flash*2.8;if(pointer){let dx=pointer.x-px,dy=pointer.y-py;if(Math.hypot(dx,dy)<145)steer+=Math.sin(Math.atan2(dy,dx)-f.a)*1.35}
let margin=Math.min(80,W*.13,H*.13);if(px<margin||px>W-margin||py<margin||py>H-margin)steer+=2*Math.sin(Math.atan2(H*.5-py,W*.5-px)-f.a);
f.flash=Math.max(0,f.flash-dt*.8);f.a+=steer*dt;let v=(15+5*f.size+f.flash*60)*dt;f.x+=Math.cos(f.a)*v/W;f.y+=Math.sin(f.a)*v/H;koi(f)}
for(let i=0;i<110;i++){let x=(i*173.7+t*(2+i%5))%W,y=(i*217.3+Math.sin(t*.4+i)*4)%H;g.fillStyle='#e8e4ae66';g.fillRect(x,y,1+i%2,1)}
pads();waves=waves.filter(w=>t-w.t<4);for(let w of waves)for(let i=0;i<3;i++){let r=(t-w.t)*125-i*9;if(r>0){g.strokeStyle='rgba(235,252,211,'+Math.max(0,(1-(t-w.t)/4)*.44/(1+i))+')';g.beginPath();g.arc(w.x,w.y,r,0,tau);g.stroke()}}requestAnimationFrame(frame)}
function pause(v){paused=v;btn.textContent=v?'Resume':'Pause'}function ripple(x,y){pause(false);waves.push({x,y,t,hit:new Set()});if(waves.length>22)waves.shift()}c.onpointerdown=e=>ripple(e.clientX,e.clientY);c.onpointermove=e=>pointer={x:e.clientX,y:e.clientY};c.onpointerleave=c.onpointercancel=()=>pointer=null;c.onpointerup=e=>{if(e.pointerType==='touch')pointer=null};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ripple(W/2,H/2)}};btn.onclick=()=>pause(!paused);onresize=resize;resize();pause(paused);requestAnimationFrame(frame);
</script></html>
